spring.application.name=sae

# ─── Base de datos SQLite ───────────────────────────────────────────────────
spring.datasource.url=jdbc:sqlite:./data/taller.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite no soporta escrituras concurrentes: limitamos el pool a 1 conexion
spring.datasource.hikari.maximum-pool-size=1
# Activa soporte de claves foraneas en cada conexion (SQLite lo requiere explicitamente)
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# "none": Flyway gestiona el schema, Hibernate NO toca la base de datos
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Flyway ─────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Necesario si la base ya existe y no tiene tabla de historial de Flyway
spring.flyway.baseline-on-migrate=true

# ─── JWT ────────────────────────────────────────────────────────────────────
# IMPORTANTE: cambiar esta clave en produccion (minimo 256 bits / 32 caracteres)
app.jwt.secret=clave-secreta-del-sistema-sae-cambiar-en-produccion-32chars
app.jwt.expiration-ms=86400000

# ─── CORS ───────────────────────────────────────────────────────────────────
# Puerto donde corre React en desarrollo (Vite usa 5173 por defecto)
app.cors.allowed-origins=http://localhost:5173

# ─── Servidor ───────────────────────────────────────────────────────────────
server.port=8080
