spring.application.name=sae

# Incluye el campo "message" en las respuestas de error (ResponseStatusException)
server.error.include-message=always

# ─── Base de datos PostgreSQL ───────────────────────────────────────────────
# En Railway: configurar SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sae}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# "none": Flyway gestiona el schema, Hibernate NO toca la base de datos
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─── Flyway ─────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ─── JWT ────────────────────────────────────────────────────────────────────
# IMPORTANTE: cambiar esta clave en produccion (minimo 256 bits / 32 caracteres)
app.jwt.secret=clave-secreta-del-sistema-sae-cambiar-en-produccion-32chars
app.jwt.expiration-ms=86400000

# ─── CORS ───────────────────────────────────────────────────────────────────
# Puerto donde corre React en desarrollo (Vite usa 5173 por defecto)
app.cors.allowed-origins=http://localhost:5173

# ─── Servidor ───────────────────────────────────────────────────────────────
server.port=8080
